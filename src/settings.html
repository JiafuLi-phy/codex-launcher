<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Launcher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;padding:20px}
h1{font-size:20px;margin-bottom:4px;color:#7cff6b}
.sub{font-size:12px;color:#888;margin-bottom:20px}
.section{margin-bottom:16px}
.section-title{font-size:14px;font-weight:600;margin-bottom:8px;color:#7cff6b}
input,select{width:100%;padding:8px 12px;border:1px solid #333;border-radius:6px;background:#16213e;color:#eee;font-size:13px;margin-bottom:8px}
input:focus,select:focus{outline:none;border-color:#7cff6b}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600}
.btn-primary{background:#7cff6b;color:#1a1a2e}
.btn-danger{background:#ff4757;color:#fff}
.btn-sm{padding:4px 12px;font-size:12px}
.model-card{background:#16213e;border-radius:8px;padding:12px;margin-bottom:8px}
.model-card .name{font-weight:600;font-size:14px;margin-bottom:4px}
.model-card .details{font-size:11px;color:#888}
.model-card .actions{margin-top:8px;display:flex;gap:8px;justify-content:flex-end}
.port-row{display:flex;gap:8px;align-items:end}
.port-row input{width:100px}
.status{font-size:12px;padding:4px 8px;border-radius:4px;display:inline-block}
.status-on{background:#7cff6b33;color:#7cff6b}
.status-off{background:#ff475733;color:#ff4757}
.footer{margin-top:24px;text-align:center;font-size:11px;color:#555}
</style>
</head>
<body>

<h1>🤖 Codex Launcher</h1>
<p class="sub">在 Codex 中使用任意大模型 · 菜单栏切换 · 热重载</p>

<div class="section">
  <div class="section-title">🎯 当前模型</div>
  <select id="activeModel" onchange="setActive()">
  </select>
</div>

<div class="section">
  <div class="section-title">⚡ 代理状态</div>
  <span id="proxyStatus" class="status status-off">检查中...</span>
  <span style="font-size:12px;margin-left:8px;color:#888">端口: <span id="portDisplay">53683</span></span>
</div>

<div class="section">
  <div class="section-title">➕ 添加新模型</div>
  <input id="newId" placeholder="模型ID (如 deepseek-v4-pro)">
  <input id="newName" placeholder="显示名称 (如 DeepSeek V4 Pro)">
  <div class="row">
    <input id="newHost" placeholder="API主机 (如 api.deepseek.com)">
    <input id="newPrefix" placeholder="路径前缀 (如 /compatible-mode)">
  </div>
  <input id="newKey" type="password" placeholder="API Key (留空继承全局Key)">
  <button class="btn btn-primary" onclick="addModel()" style="width:100%">添加模型</button>
</div>

<div class="section">
  <div class="section-title">📋 已配置模型 (<span id="modelCount">0</span>)</div>
  <div id="modelList"></div>
</div>

<div class="footer">
  Codex Launcher v1.0 · 跨平台 · 代理内嵌 · <span id="portFooter">端口 53683</span>
</div>

<script>
let cfg = {};

async function init() {
  cfg = await electronAPI.getConfig();
  document.getElementById('portDisplay').textContent = cfg.port;
  document.getElementById('portFooter').textContent = '端口 ' + cfg.port;
  document.getElementById('activeModel').innerHTML = cfg.models.map(m =>
    `<option value="${m.id}" ${m.id===cfg.activeModel?'selected':''}>${m.name} (${m.provider})</option>`
  ).join('');
  renderModels();
  updateStatus();
}

function renderModels() {
  document.getElementById('modelCount').textContent = cfg.models.length;
  document.getElementById('modelList').innerHTML = cfg.models.map(m => `
    <div class="model-card">
      <div class="name">${m.name} ${m.id===cfg.activeModel?'🟢':''}</div>
      <div class="details">${m.id} · ${m.apiHost}${m.pathPrefix||''} · ${m.apiKey?'🔑有Key':'⚠无Key'}</div>
      <div class="actions">
        ${m.id!==cfg.activeModel?`<button class="btn btn-primary btn-sm" onclick="setActiveId('${m.id}')">设为当前</button>`:''}
        <button class="btn btn-danger btn-sm" onclick="removeModel('${m.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

async function addModel() {
  const m = {
    id: document.getElementById('newId').value.trim(),
    name: document.getElementById('newName').value.trim(),
    provider: document.getElementById('newId').value.trim().split('/')[0],
    apiHost: document.getElementById('newHost').value.trim(),
    pathPrefix: document.getElementById('newPrefix').value.trim(),
    apiKey: document.getElementById('newKey').value.trim(),
  };
  if(!m.id||!m.name||!m.apiHost) return alert('请填写模型ID、名称和API主机');
  cfg.models.push(m);
  await electronAPI.saveConfig(cfg);
  init();
  ['newId','newName','newHost','newPrefix','newKey'].forEach(id=>document.getElementById(id).value='');
}

async function removeModel(id) { if(!confirm('删除 ' + id + '?')) return; cfg.models=cfg.models.filter(m=>m.id!==id); await electronAPI.saveConfig(cfg); init(); }
async function setActive() { cfg.activeModel=document.getElementById('activeModel').value; await electronAPI.saveConfig(cfg); init(); }
async function setActiveId(id) { cfg.activeModel=id; await electronAPI.saveConfig(cfg); init(); }
async function updateStatus() { const on=await electronAPI.getProxyStatus(); document.getElementById('proxyStatus').textContent=on?'🟢 运行中':'🔴 已停止'; document.getElementById('proxyStatus').className='status '+(on?'status-on':'status-off'); }
setInterval(updateStatus,5000);
init();
</script>
</body>
</html>
